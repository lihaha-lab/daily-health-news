model: "${OLLAMA_MODEL:-qwen2.5:3b}"
max_articles_per_digest: 5
balance_digest_categories: true
max_articles_per_category: 5
max_article_age_hours: 168
preferred_languages: []
digest_language: "zh"
max_key_takeaways: 2
max_summary_paragraphs: 1
summarize_workers: 2

briefing:
  title: "每日心脑健康简报"
  audience: "中国大陆普通居民；用简洁易懂的语言了解心脑血管健康、日常预防和健康生活"
  editorial_guidance:
    - "这是给中国大陆普通居民看的泛健康新闻简报，重点关注心脏、心脑血管、心梗、心脏骤停、猝死、卒中、血压血脂血糖、急救与预防"
    - "国内新闻和地方新闻优先；可收录地方媒体、公开媒体报道、官方健康机构信息及心血管年度报告"
    - "每天目标约3条，通常2至5条；宁可少于2条并说明暂无足量新闻，也不重复旧闻或编造补足"
    - "公开人物突发健康事件可纳入，但只按来源明确写出的事实表述；死因未明确时不得写成因心梗/猝死去世，不暗示未证实的生活习惯导致死亡"
    - "标题可以简洁醒目，但不得夸大或将未经证实的死因写成确定事实"
    - "摘要面向普通人，简明说明发生了什么、与日常健康有什么关联；不要堆医学术语，不提供诊断、处方或个体化治疗建议"
    - "摘要只概括原文确实谈到的心脑血管事实；有直接依据时才用1至2句说明其与日常预防的关系。不得为普通运动、情绪或其他健康新闻硬加心脑血管提醒，不承诺保健品疗效，也不将疾病归咎于个人"
    - "心血管年报和研究数据须注明年份、统计范围及来源，不把旧数据说成最新数据，不把相关性说成因果"
    - "即使来源门槛放宽，也必须保留可追溯的原文链接到新闻表格；无法确认的内容标注为媒体报道或线索，不冒充官方结论"
    - "文档简报只呈现日期、标题、来源和内容摘要；不展示来源链接、原始标题、分类、读者视角或额外免责声明"
  disclaimer: ""

schedule:
  timezone: "Pacific/Auckland"
  times: ["11:00"]

# This edition prioritizes consumer-facing health and everyday prevention.
# Professional regulatory feeds are intentionally not part of the main stream.
feeds:
  - url: "https://www.who.int/rss-feeds/news-english.xml"
    category: "日常预防与公共健康"
    priority: 2
    publisher: "World Health Organization"
    region: "global"
    trust_tier: "primary"
    publication_mode: "direct"
    hide_keywords:
      - "health workforce"
      - "emergency appeal"
      - "donor"
      - "procurement"
      - "tender"
      - "technical consultation"
    highlight_keywords:
      - "nutrition"
      - "physical activity"
      - "mental health"
      - "sleep"
      - "tobacco"
      - "food safety"
      - "healthy diet"
      - "children"
      - "older people"
    require_keywords: []

# Google News is only a discovery layer. The collector publishes an item only
# after resolving it to one of the explicitly allowlisted original domains.
google_news:
  - query: "site:nhc.gov.cn (心脏 OR 心血管 OR 心梗 OR 猝死 OR 卒中 OR 血压 OR 健康科普 OR 饮食 OR 运动) when:7d"
    language: "zh"
    country: "CN"
    category: "心脑血管健康与民生新闻"
    priority: 1
    publisher: "国家卫生健康委员会"
    publisher_domains: ["nhc.gov.cn"]
    region: "CN"
    trust_tier: "primary"
    publication_mode: "direct"
    hide_keywords: ["临床试验", "医院运营", "医务人员招聘", "学术会议", "药品审批", "器械注册"]
    highlight_keywords: ["饮食", "营养", "睡眠", "运动", "心理健康", "食品安全", "体重管理", "辟谣"]
    require_keywords: ["心脏", "心血管", "心梗", "猝死", "卒中", "血压", "健康科普", "饮食", "运动"]

  - query: "site:chinacdc.cn (心脑血管 OR 心脏 OR 心梗 OR 卒中 OR 高血压 OR 健康生活 OR 运动 OR 营养) when:7d"
    language: "zh"
    country: "CN"
    category: "心脑血管健康与民生新闻"
    priority: 1
    publisher: "中国疾病预防控制中心"
    publisher_domains: ["chinacdc.cn"]
    region: "CN"
    trust_tier: "primary"
    publication_mode: "direct"
    hide_keywords: ["招聘", "学术会议", "培训班", "实验室研究"]
    highlight_keywords: ["营养", "运动", "睡眠", "心理健康", "食品安全", "健康科普", "辟谣"]
    require_keywords: ["心脑血管", "心脏", "心梗", "卒中", "高血压", "健康生活", "运动", "营养"]

  - query: "site:cdc.gov (nutrition OR healthy diet OR sleep OR exercise OR mental health OR food safety) when:7d"
    language: "en"
    country: "CN"
    category: "海外健康生活动态（需说明适用地区）"
    priority: 2
    publisher: "U.S. Centers for Disease Control and Prevention"
    publisher_domains: ["www.cdc.gov"]
    region: "US"
    trust_tier: "primary"
    publication_mode: "direct"
    hide_keywords: ["clinical trial", "for healthcare professionals", "hospital workforce", "drug approval", "medical device approval"]
    highlight_keywords: ["nutrition", "sleep", "exercise", "mental health", "food safety", "consumer health"]
    require_keywords: ["nutrition", "sleep", "exercise", "mental health", "food safety", "wellbeing", "healthy lifestyle", "consumer health"]

  - query: "site:nhs.uk (nutrition OR healthy diet OR sleep OR exercise OR mental wellbeing OR food safety) when:7d"
    language: "en"
    country: "CN"
    category: "海外健康生活动态（需说明适用地区）"
    priority: 2
    publisher: "UK National Health Service"
    publisher_domains: ["www.nhs.uk"]
    region: "UK"
    trust_tier: "primary"
    publication_mode: "direct"
    hide_keywords: ["clinical trial", "for healthcare professionals", "hospital workforce", "drug approval", "medical device approval"]
    highlight_keywords: ["nutrition", "sleep", "exercise", "mental health", "food safety", "wellbeing"]
    require_keywords: ["nutrition", "sleep", "exercise", "mental health", "food safety", "wellbeing", "healthy lifestyle"]

  # Regional Chinese newsrooms surface practical local health and consumer alerts
  # that are often absent from national feeds. The final links must resolve to
  # these publisher domains, never to the Google News redirect.
  - query: "(site:ycwb.com OR site:hangzhou.com.cn) (健康 OR 食品安全 OR 饮食 OR 睡眠 OR 运动 OR 急救 OR 心梗) when:7d"
    language: "zh"
    country: "CN"
    category: "地方健康与民生提醒"
    priority: 1
    publisher_domains: ["ycwb.com", "hangzhou.com.cn"]
    region: "CN"
    trust_tier: "reputable"
    publication_mode: "direct"
    hide_keywords: ["招聘", "招商", "广告", "推广"]
    highlight_keywords: ["食品安全", "健康提醒", "急救", "心梗", "心脏骤停", "睡眠", "营养"]
    require_keywords: ["健康", "食品安全", "饮食", "睡眠", "运动", "急救", "心梗", "心脏骤停", "营养", "猝死"]

  # Public reporting can be included, but the digest must not infer a cause of death.
  - query: "(干部 OR 官员 OR 公职人员 OR 知名人士 OR 主持人 OR 企业家 OR 演员 OR 运动员) (心梗 OR 心肌梗死 OR 心源性猝死 OR 心脏骤停 OR 突发疾病) when:30d"
    language: "zh"
    country: "CN"
    category: "心脑健康与公开人物突发事件（需核实）"
    priority: 1
    publisher_domains: ["people.com.cn", "news.cn", "chinanews.com.cn", "ycwb.com", "hangzhou.com.cn"]
    region: "CN"
    trust_tier: "discovery"
    publication_mode: "direct"
    hide_keywords: ["网传", "疑似", "未经证实", "营销号", "自媒体爆料"]
    highlight_keywords: ["官方通报", "心梗", "心肌梗死", "心源性猝死", "心脏骤停", "急救"]
    require_keywords: ["干部", "官员", "公职人员", "知名人士", "主持人", "企业家", "演员", "运动员", "心梗", "心肌梗死", "心源性猝死", "心脏骤停", "突发疾病"]

  # WeChat Official Account pages are a discovery source only until the account
  # identity can be verified against its publisher. Video-channel URLs can be
  # added as explicit sources once a public, fetchable canonical link is known.
  - query: "site:mp.weixin.qq.com (\"杭州交通\" OR \"羊城晚报\") (健康 OR 食品安全 OR 心梗 OR 心源性猝死 OR 急救 OR 睡眠 OR 营养) when:30d"
    language: "zh"
    country: "CN"
    category: "微信公众号线索（账号待核实）"
    priority: 3
    publisher_domains: ["mp.weixin.qq.com"]
    region: "CN"
    trust_tier: "discovery"
    publication_mode: "discovery_only"
    hide_keywords: ["营销", "带货", "软文", "未经证实"]
    highlight_keywords: ["健康", "食品安全", "心梗", "猝死", "急救", "睡眠", "营养"]
    require_keywords: ["杭州交通", "羊城晚报", "健康", "食品安全", "心梗", "猝死", "急救", "睡眠", "营养"]

  - query: "(心血管年报 OR 中国心血管健康与疾病报告 OR 心脑血管死亡 OR 心血管疾病负担) when:365d"
    language: "zh"
    country: "CN"
    category: "心血管年度数据"
    priority: 1
    publisher_domains: ["nccd.org.cn", "chinacdc.cn", "people.com.cn", "news.cn", "chinanews.com.cn"]
    region: "CN"
    trust_tier: "reputable"
    publication_mode: "direct"
    hide_keywords: ["招聘", "招商", "广告", "推广"]
    highlight_keywords: ["年报", "年度", "死亡", "患病率", "趋势", "心脑血管"]
    require_keywords: ["年报", "心血管", "心脑血管", "死亡", "疾病负担"]

youtube_channels: []
watch_urls: []

exclude_keywords:
  - "sponsored"
  - "advertorial"
  - "promotional campaign"

# A hard gate on the original title or source snippet. Generic wellness terms
# deliberately do not qualify; fewer relevant stories beat padded digests.
required_topic_keywords:
  - "心脑血管"
  - "心血管"
  - "心脏"
  - "心梗"
  - "心肌梗"
  - "心衰"
  - "心律失常"
  - "房颤"
  - "冠心病"
  - "心源性"
  - "心肺复苏"
  - "AED"
  - "卒中"
  - "中风"
  - "脑血管"
  - "脑梗"
  - "脑出血"
  - "动脉粥样硬化"
  - "cardiovascular"
  - "cardiac arrest"
  - "heart attack"
  - "heart disease"
  - "stroke"
  - "coronary"
  - "atrial fibrillation"

# These risk-factor terms qualify only when the headline is about them.
# Incidental mentions in generic diet or exercise stories are insufficient.
required_title_keywords:
  - "高血压"
  - "血压"
  - "血脂"
  - "胆固醇"
  - "hypertension"
  - "blood pressure"

relevance:
  min_ratings_for_learning: 5
  tfidf_preference_weight: 0.35
  category_preference_weight: 0.6
  source_preference_weight: 0.3
  rating_decay_half_life_days: 30
  implicit_signal_weight: 0.5
  embedding_provider: "off"
  semantic_dedup_enabled: false
  llm_rerank_enabled: false
  initial_keywords:
    high:
      - "心脑血管"
      - "心血管"
      - "心脏"
      - "心梗"
      - "卒中"
      - "心脏骤停"
      - "冠心病"
    medium:
      - "心血管年报"
      - "高血压"
      - "血压"
      - "血脂"
      - "饮食营养"
      - "运动健身"
      - "睡眠"
  topic_synonyms:
    everyday_wellness: ["健康生活", "日常保健", "生活方式", "wellbeing", "healthy lifestyle"]
    food_nutrition: ["饮食营养", "食品安全", "nutrition", "healthy diet", "food safety"]
    movement_sleep_mind: ["运动", "睡眠", "心理健康", "physical activity", "sleep", "mental health"]

output:
  format: "both"
  path: "data/digests"

llm:
  provider: "ollama"
  ollama_host: "${OLLAMA_HOST:-http://ollama:11434}"
  manage_lifecycle: false

vps:
  enabled: false
  host: ""
